<!DOCTYPE html>
<html>
<head>
    <title>Pose Landmarker - Wink Log</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <style>
        body { font-family: sans-serif; margin: 0; background: #000; color: #fff; overflow: hidden; }
        .container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        #webcam { position: absolute; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        #output_canvas { position: absolute; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        #status { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 8px; }
        .wave-alert { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 3rem; color: #0f0; font-weight: bold; display: none; text-shadow: 0 0 10px #000; }
    </style>
</head>
<body>
    <div class="container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas"></canvas>
        <div id="status">Warten auf Kamera...</div>
        <div id="wave-alert" class="wave-alert">👋 WINKEN ERKANNT!</div>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusElement = document.getElementById('status');
        const alertElement = document.getElementById('wave-alert');

        let lastWaveTime = 0;
        const angleHistory = [];
        const MAX_HISTORY = 30; // Größeres Fenster für langsamere Bewegungen
        let directionChanges = 0;
        let lastDirection = 0; 
        let lastDirectionTime = 0;

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            if (results.poseLandmarks) {
                drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#00FF00', lineWidth: 4});
                drawLandmarks(canvasCtx, results.poseLandmarks, {color: '#FF0000', lineWidth: 2});
                
                detectWave(results.poseLandmarks);
            }
            canvasCtx.restore();
        }

        const pose = new Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });

        pose.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        pose.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                canvasElement.width = videoElement.videoWidth;
                canvasElement.height = videoElement.videoHeight;
                await pose.send({image: videoElement});
            },
            width: 1280,
            height: 720
        });

        camera.start().then(() => {
            statusElement.innerText = "Aktiv: Wink zum Loggen";
        });

        function calculateAngle(p1, p2, p3) {
            const radians = Math.atan2(p3.y - p2.y, p3.x - p2.x) - Math.atan2(p1.y - p2.y, p1.x - p2.x);
            let angle = Math.abs(radians * 180.0 / Math.PI);
            if (angle > 180.0) angle = 360 - angle;
            return angle;
        }

        function detectWave(landmarks) {
            const nose = landmarks[0];
            const leftShoulder = landmarks[11];
            const rightShoulder = landmarks[12];
            const leftElbow = landmarks[13];
            const rightElbow = landmarks[14];
            const leftWrist = landmarks[15];
            const rightWrist = landmarks[16];
            const leftHip = landmarks[23];
            const rightHip = landmarks[24];
            
            if (!nose || (!leftWrist && !rightWrist)) return;

            let isLeft = (leftWrist && (!rightWrist || leftWrist.y < rightWrist.y));
            let wrist = isLeft ? leftWrist : rightWrist;
            let elbow = isLeft ? leftElbow : rightElbow;
            let shoulder = isLeft ? leftShoulder : rightShoulder;
            let hip = isLeft ? leftHip : rightHip;

            if (!shoulder || !elbow || !wrist || !hip ||
                shoulder.visibility < 0.5 || 
                elbow.visibility < 0.5 || 
                wrist.visibility < 0.5) {
                angleHistory.length = 0;
                directionChanges = 0;
                lastDirection = 0;
                return;
            }
            
            if (wrist.y < nose.y) {
                const angle = calculateAngle(hip, shoulder, elbow);
                const now = Date.now();

                if (angleHistory.length > 0) {
                    // Nutze einen gleitenden Durchschnitt oder vergleiche mit einem Punkt weiter zurück
                    // um nervöses Zittern (schnelle kleine Änderungen) zu ignorieren.
                    const lookbackIndex = Math.max(0, angleHistory.length - 5);
                    const diff = angle - angleHistory[lookbackIndex];
                    
                    // Schwelle erhöht auf 10 Grad (größere Bewegung erforderlich)
                    const currentDirection = diff > 10.0 ? 1 : (diff < -10.0 ? -1 : 0);
                    
                    if (currentDirection !== 0 && currentDirection !== lastDirection) {
                        // Zeitlicher Filter: Richtungswechsel darf nicht zu schnell erfolgen (> 300ms)
                        // Verhindert Erkennung von schnellem Zittern/Schütteln
                        if (lastDirection !== 0 && (now - lastDirectionTime > 300)) {
                            directionChanges++;
                            lastDirectionTime = now;
                        }
                        lastDirection = currentDirection;
                    }
                }

                angleHistory.push(angle);
                if (angleHistory.length > MAX_HISTORY) angleHistory.shift();
                
                if (directionChanges >= 4) { 
                    if (now - lastWaveTime > 10000) {
                        lastWaveTime = now;
                        directionChanges = 0;
                        triggerLog();
                    }
                }
            } else {
                angleHistory.length = 0;
                directionChanges = 0;
                lastDirection = 0;
            }
        }

        async function triggerLog() {
            alertElement.style.display = 'block';
            setTimeout(() => alertElement.style.display = 'none', 3000);
            
            statusElement.innerText = "Logge...";
            
            const captureCanvas = document.createElement('canvas');
            captureCanvas.width = videoElement.videoWidth;
            captureCanvas.height = videoElement.videoHeight;
            const ctx = captureCanvas.getContext('2d');
            ctx.scale(-1, 1);
            ctx.drawImage(videoElement, -captureCanvas.width, 0);
            const image = captureCanvas.toDataURL('image/jpeg', 0.8);

            try {
                const response = await fetch('/api/log', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image })
                });
                const result = await response.json();
                statusElement.innerText = result.success ? "Erfolgreich geloggt!" : "Fehler beim Loggen";
            } catch (e) {
                statusElement.innerText = "Netzwerkfehler";
            }
            
            setTimeout(() => statusElement.innerText = "Aktiv: Wink zum Loggen", 5000);
        }
    </script>
</body>
</html>
