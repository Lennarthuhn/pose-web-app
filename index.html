<!DOCTYPE html>
<html>
<head>
    <title>Pose Landmarker - Wink Log</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <style>
        body { font-family: sans-serif; margin: 0; background: #000; color: #fff; overflow: hidden; }
        .container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        #webcam { position: absolute; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        #output_canvas { position: absolute; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        #status { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 8px; }
        .wave-alert { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 3rem; color: #0f0; font-weight: bold; display: none; text-shadow: 0 0 10px #000; }
    </style>
</head>
<body>
    <div class="container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas"></canvas>
        <div id="status">Warten auf Kamera...</div>
        <div id="wave-alert" class="wave-alert">👋 WINKEN ERKANNT!</div>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusElement = document.getElementById('status');
        const alertElement = document.getElementById('wave-alert');

        let lastWaveTime = 0;
        let currentState = "CENTER"; 
        let zoneSwitches = 0;
        let lastSwitchTime = 0;
        let switchHistory = [];
        let lastLandmarks = null;
        let lastAngle = null;

        const RESET_TIMEOUT_MS = 2000; 
        const MIN_WAVE_DURATION_MS = 1800;
        const REQUIRED_SWITCHES = 6; 
        const MAX_JUMP_DISTANCE = 0.15;

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            if (results.poseLandmarks) {
                drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#00FF00', lineWidth: 4});
                drawLandmarks(canvasCtx, results.poseLandmarks, {color: '#FF0000', lineWidth: 2});
                
                detectWave(results.poseLandmarks);
            }
            canvasCtx.restore();
        }

        const pose = new Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });

        pose.setOptions({
            modelComplexity: 2, 
            smoothLandmarks: true,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        pose.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                canvasElement.width = videoElement.videoWidth;
                canvasElement.height = videoElement.videoHeight;
                await pose.send({image: videoElement});
            },
            width: 1280,
            height: 720
        });

        camera.start().then(() => {
            statusElement.innerText = "Aktiv: Deutlich winken zum Loggen";
        });

        function calculateAngle(p1, p2, p3) {
            const radians = Math.atan2(p3.y - p2.y, p3.x - p2.x) - Math.atan2(p1.y - p2.y, p1.x - p2.x);
            let angle = Math.abs(radians * 180.0 / Math.PI);
            if (angle > 180.0) angle = 360 - angle;
            return angle;
        }

        function isInFrame(lm) {
            const margin = 0.02; // 2% Rand lassen zur Sicherheit
            return lm && lm.x >= margin && lm.x <= (1.0 - margin) && lm.y >= margin && lm.y <= (1.0 - margin);
        }

        function isJumping(lm, lastLm) {
            if (!lastLm) return false;
            const dist = Math.sqrt(Math.pow(lm.x - lastLm.x, 2) + Math.pow(lm.y - lastLm.y, 2));
            return dist > MAX_JUMP_DISTANCE;
        }

        function detectWave(landmarks) {
            const nose = landmarks[0];
            const leftShoulder = landmarks[11];
            const rightShoulder = landmarks[12];
            const leftElbow = landmarks[13];
            const rightElbow = landmarks[14];
            const leftWrist = landmarks[15];
            const rightWrist = landmarks[16];
            const leftHip = landmarks[23];
            const rightHip = landmarks[24];
            
            if (!nose || (!leftWrist && !rightWrist)) return;

            let isLeft = (leftWrist && (!rightWrist || leftWrist.y < rightWrist.y));
            let wrist = isLeft ? leftWrist : rightWrist;
            let elbow = isLeft ? leftElbow : rightElbow;
            let shoulder = isLeft ? leftShoulder : rightShoulder;
            let hip = isLeft ? leftHip : rightHip;

            const now = Date.now();

            // Check ob ALLE nötigen Punkte im Bild sind (mit Randabstand)
            const requiredPoints = [nose, leftShoulder, rightShoulder, elbow, wrist, hip];
            const allInFrame = requiredPoints.every(p => isInFrame(p) && p.visibility > 0.8);

            if (!allInFrame) {
                if (now - lastSwitchTime > RESET_TIMEOUT_MS) resetWave();
                return;
            }

            // Jump Check
            if (lastLandmarks) {
                const activeIndices = isLeft ? [11, 13, 15, 23] : [12, 14, 16, 24];
                for (let idx of activeIndices) {
                    if (isJumping(landmarks[idx], lastLandmarks[idx])) {
                        resetWave();
                        lastLandmarks = landmarks;
                        return;
                    }
                }
            }
            lastLandmarks = landmarks;
            
            if (wrist.y < nose.y) {
                let angle = calculateAngle(hip, shoulder, elbow);

                if (lastAngle !== null) {
                    angle = (angle * 0.4) + (lastAngle * 0.6);
                }
                lastAngle = angle;

                let newZone = currentState;
                if (angle < 95) newZone = "LEFT";
                else if (angle > 145) newZone = "RIGHT";

                if (newZone !== currentState && newZone !== "CENTER") {
                    const timeSinceLast = now - lastSwitchTime;
                    if (timeSinceLast > 250 && timeSinceLast < 1000) {
                        zoneSwitches++;
                        switchHistory.push(now);
                        currentState = newZone;
                        lastSwitchTime = now;
                        statusElement.innerText = `Winken erkannt: ${Math.floor(zoneSwitches/2)}x`;
                    } else if (timeSinceLast >= 1000) {
                        resetWave();
                    }
                }

                if (now - lastSwitchTime > RESET_TIMEOUT_MS) {
                    resetWave();
                }

                if (zoneSwitches >= REQUIRED_SWITCHES) {
                    const totalDuration = now - switchHistory[0];
                    if (totalDuration >= MIN_WAVE_DURATION_MS && (now - lastWaveTime > 60000)) {
                        lastWaveTime = now;
                        triggerLog();
                    }
                    resetWave();
                }
            } else {
                if (now - lastSwitchTime > RESET_TIMEOUT_MS) resetWave();
                lastAngle = null;
            }
        }

        function resetWave() {
            currentState = "CENTER";
            zoneSwitches = 0;
            switchHistory = [];
            lastAngle = null;
            statusElement.innerText = "Aktiv: Deutlich winken zum Loggen";
        }

        async function triggerLog() {
            alertElement.style.display = 'block';
            setTimeout(() => alertElement.style.display = 'none', 3000);
            
            statusElement.innerText = "Logge...";
            
            const captureCanvas = document.createElement('canvas');
            captureCanvas.width = videoElement.videoWidth;
            captureCanvas.height = videoElement.videoHeight;
            const ctx = captureCanvas.getContext('2d');
            ctx.scale(-1, 1);
            ctx.drawImage(videoElement, -captureCanvas.width, 0);
            const image = captureCanvas.toDataURL('image/jpeg', 0.8);

            try {
                const response = await fetch('/api/log', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image })
                });
                const result = await response.json();
                statusElement.innerText = result.success ? "Erfolgreich geloggt!" : "Fehler beim Loggen";
            } catch (e) {
                statusElement.innerText = "Netzwerkfehler";
            }
            
            setTimeout(() => resetWave(), 5000);
        }
    </script>
</body>
</html>
